services:
  app:
    build: .
    env_file:
      - app.env
      - jwks.env
      - client-secrets.env
    ports:
      - "8081:8081"
    depends_on:
      - postgres-2
      - userservice

  postgres-2:
    container_name: 'authservice_postgres'
    image: 'postgres:15'
    env_file:
      - postgres.env
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  userservice:
    image: 'ghcr.io/absolute-in-doubt/usrsvc:latest'
    environment:
      - POSTGRES_URL=jdbc:postgresql://userservice_postgres:5432/user_service_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres-1
      - redis

  postgres-1:
    container_name: 'userservice_postgres'
    image: 'postgres:15'
    environment:
      - POSTGRES_DB=user_service_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
volumes:
  postgres_data:

